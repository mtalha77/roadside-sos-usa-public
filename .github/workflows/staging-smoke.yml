name: Staging smoke

# RSOS-099: after every staging deploy, check that the three staging hosts serve the new commit
# with green health checks, that "Sign in as demo" works for every role, and that Get Help reaches
# the quotes screen in demo mode. Opens an issue on failure.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: staging-smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.ref == 'staging' &&
       contains(github.event.deployment.environment, 'rsos-web'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_WEB_URL: https://staging.${{ vars.APP_DOMAIN }}
      E2E_PROVIDER_URL: https://staging-pro.${{ vars.APP_DOMAIN }}
      E2E_ADMIN_URL: https://staging-admin.${{ vars.APP_DOMAIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      EXPECTED_SHA: ${{ github.event.deployment.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait until all three staging hosts serve this commit
        if: github.event_name == 'deployment_status'
        run: |
          for host in "$E2E_WEB_URL" "$E2E_PROVIDER_URL" "$E2E_ADMIN_URL"; do
            for i in $(seq 1 60); do
              sha=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$host/api/health" | jq -r '.commit // empty' || true)
              [ "$sha" = "$EXPECTED_SHA" ] && echo "$host is on $EXPECTED_SHA" && break
              sleep 10
            done
          done
      - uses: ./.github/actions/setup
      - name: Install browsers
        run: pnpm --filter @rsos/e2e exec playwright install --with-deps chromium
      - name: Smoke tests on staging
        run: pnpm --filter @rsos/e2e exec playwright test specs/staging-smoke.spec.ts specs/demo-sign-in.spec.ts --project=desktop-chrome
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Staging smoke test failed" --label critical --body "The staging smoke test failed after a deploy: ${RUN_URL}"
