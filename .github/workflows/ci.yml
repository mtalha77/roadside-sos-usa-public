name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

# Job names are the required status checks on main and staging. Renaming a job means
# updating branch protection too (see CLAUDE.md, "Git workflow").
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so Turborepo can work out which apps changed
      - uses: ./.github/actions/setup
      - name: Build affected apps (pull requests) or everything (pushes)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run build --affected
          else
            pnpm build
          fi

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # rsos-dev is shared by every pull request: apply migrations one run at a time.
    concurrency:
      group: supabase-rsos-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID_DEV }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check secrets are available
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Database check skipped::Secrets are not available to this run (fork or Dependabot pull request)."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Supabase CLI
        if: steps.guard.outputs.run == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - name: Link rsos-dev
        if: steps.guard.outputs.run == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply migrations to rsos-dev
        if: steps.guard.outputs.run == 'true'
        run: supabase db push --remote --yes
      - name: Run database tests on rsos-dev
        if: steps.guard.outputs.run == 'true'
        run: supabase test db --remote --yes
      - name: Set Auth URLs on rsos-dev
        if: steps.guard.outputs.run == 'true'
        run: scripts/supabase-auth-urls.sh dev "$SUPABASE_PROJECT_ID"
