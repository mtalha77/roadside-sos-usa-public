name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

# Job names are the required status checks on main and staging. Renaming a job means
# updating branch protection too (see CLAUDE.md, "Git workflow").
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - name: Design tokens meet WCAG 2.2 AA and theme.css is up to date
        run: pnpm --filter @rsos/config tokens:check
      - name: No hardcoded brand name or domain
        run: node scripts/check-brand.ts
      - name: Dependency audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so Turborepo can work out which apps changed
      - uses: ./.github/actions/setup
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/*/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - name: Ensure cache folders exist (first run has no restored cache)
        run: mkdir -p apps/web/.next/cache apps/provider/.next/cache apps/admin/.next/cache
      - name: Build affected apps (pull requests) or everything (pushes)
        env:
          # Lets turbo --affected compare against the PR base instead of guessing.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run build --affected 2>&1 | tee build.log
          else
            pnpm build 2>&1 | tee build.log
          fi
      - name: Warnings are failures
        run: scripts/ci/assert-no-warnings.sh build.log

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # rsos-dev is shared by every pull request: apply migrations one run at a time.
    concurrency:
      group: supabase-rsos-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID_DEV }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check secrets are available
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Database check skipped::Secrets are not available to this run (fork or Dependabot pull request)."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Supabase CLI
        if: steps.guard.outputs.run == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - name: Link rsos-dev
        if: steps.guard.outputs.run == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply migrations and the dev-only seed to rsos-dev
        if: steps.guard.outputs.run == 'true'
        run: supabase db push --remote --yes --include-seed
      - name: Run database tests on rsos-dev
        if: steps.guard.outputs.run == 'true'
        run: supabase test db --remote --yes
      - name: Set Auth URLs on rsos-dev
        if: steps.guard.outputs.run == 'true'
        run: scripts/supabase-auth-urls.sh dev "$SUPABASE_PROJECT_ID"

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build Storybook
        run: pnpm --filter @rsos/ui build-storybook
      - name: Install Chromium
        run: pnpm --filter @rsos/e2e exec playwright install --with-deps chromium
      - name: Every story passes axe with no console errors; overlays and DataTable behave (real browser)
        run: pnpm --filter @rsos/e2e test:storybook
      - name: Upload Storybook test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-storybook
          path: tests/e2e/playwright-report-storybook
          retention-days: 7

  e2e:
    name: e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Wait for Vercel previews
        id: previews
        run: scripts/ci/wait-for-previews.sh "${{ github.event.pull_request.head.sha }}"
      - name: Install browsers
        run: pnpm --filter @rsos/e2e exec playwright install --with-deps chromium webkit
      - name: Playwright (mobile Safari, mobile Chrome, desktop Chrome) with axe and console checks
        env:
          E2E_WEB_URL: ${{ steps.previews.outputs.web_url }}
          E2E_PROVIDER_URL: ${{ steps.previews.outputs.provider_url }}
          E2E_ADMIN_URL: ${{ steps.previews.outputs.admin_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter @rsos/e2e test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Wait for Vercel previews
        id: previews
        run: scripts/ci/wait-for-previews.sh "${{ github.event.pull_request.head.sha }}"
      - name: Install Chromium
        run: pnpm --filter @rsos/e2e exec playwright install --with-deps chromium
      - name: Lighthouse budgets (mobile LCP < 2 s, CLS < 0.05, accessibility >= 0.9)
        env:
          LIGHTHOUSE_URLS: ${{ steps.previews.outputs.web_url }}
        run: pnpm --filter @rsos/e2e lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: tests/e2e/lighthouse-report
          if-no-files-found: ignore
          retention-days: 7

  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Dependency review (new vulnerable or disallowed dependencies)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
